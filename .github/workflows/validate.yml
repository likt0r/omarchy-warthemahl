name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Model and manifest tests
        run: node --test tests/model.test.js
      # -B keeps __pycache__ out of the checkout: inside a real plugin folder it
      # makes the Omarchy shell's file watcher reload the plugin on every run.
      - name: Parser tests against the captured page
        run: python3 -B -m unittest discover -s tests
